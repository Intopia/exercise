<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Form controls - focus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="favicon.ico">
  <style>
:focus {
  outline: 3px solid purple;
  outline-offset: 2px;
}

.example {margin: .5em 0;}
  </style>
</head>
<body>
<main>

<h1>Form controls - focus</h1>

<div class="example">
  <button>Button</button>
</div>

<div class="example">
  <textarea class="input" id="textarea"></textarea>
</div>

<div class="example">
  <select class="input" id="select">
    <option>Option 1</option>
    <option>Option 2</option>
    <option>Option 3</option>
    <option>Option 4</option>
  </select>
</div>

<div class="example">
  <input type="button" value="Button">
</div>

<div class="example">
  <input id="checkbox" type="checkbox">
  <label for="checkbox">Checkbox</label>
</div>

<div class="example">
  <input id="color" type="color">
</div>

<div class="example">
  <input id="date" type="date">
</div>

<div class="example">
  <input id="datetime-local" type="datetime-local">
</div>

<div class="example">
  <input class="input" id="email" type="email">
</div>

<div class="example">
  <input id="file" type="file">
</div>

<div class="example">
  <input type="image" alt="Login" src="https://placehold.co/30x30">
</div>

<div class="example">
  <input id="month" type="month">
</div>

<div class="example">
  <input class="input" id="number" type="number">
</div>

<div class="example">
  <input class="input" id="password" type="password">
</div>

<div class="example">
  <input id="radio" type="radio" name="radio-group">
  <label for="radio">Radio button</label>
</div>

<div class="example">
  <input id="range" type="range">
</div>

<div class="example">
  <input type="reset">
</div>

<div class="example">
  <input id="search" type="search">
</div>

<div class="example">
  <input type="submit">
</div>

<div class="example">
  <input class="input" id="tel" type="tel">
</div>

<div class="example">
  <input class="input" id="text" type="text">
</div>

<div class="example">
  <input class="input" id="time" type="time">
</div>

<div class="example">
  <input class="input" id="url" type="url">
</div>

<div class="example">
  <input class="input" id="week" type="week">
</div>

</main>
</body>
</html>
