<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Testing movement - Intopia</title>
  <meta name="description" content="Test a canvas animation of moving circles with a pause and resume button, and support for the prefers-reduced-motion setting to start paused.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link href="assets/css/testing.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/testing-darkmode.css" media="(prefers-color-scheme: dark)">
  <script src="assets/js/table-wrap.js" defer></script>
  <style>
    canvas {
      display: block;
      max-width: 100%;
      height: auto;
      border: 1px solid currentColor;
    }
  </style>
</head>
<body>
<main>

<a class="intopia-home-link" href="https://intopia.digital/" aria-label="Intopia home">
  <picture>
    <source srcset="assets/img/intopia-logo-white.png" media="(prefers-color-scheme: dark)">
    <img src="assets/img/intopia.png" alt="Intopia logo. The word 'intopia' in black, with the 'o' made from four curved brush strokes in pink, orange, yellow and turquoise." class="intopia-logo">
  </picture>
</a>

<p class="header-link"><span aria-hidden="true" class="arrow">&laquo;</span> <a href="testing.html">Back to home</a></p>

<h1>Testing movement</h1>

<p>Moving content that starts automatically and lasts more than five seconds needs a way to pause, stop or hide it, to pass <a href="https://www.w3.org/TR/WCAG22/#pause-stop-hide" target="_blank">Success Criterion 2.2.2 Pause, Stop, Hide</a>. If your operating system is set to reduce motion, this animation starts paused.</p>

<canvas id="canvas" width="600" height="400" aria-hidden="true"></canvas>

<p><button type="button" id="pauseButton">Pause animation</button></p>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const pauseButton = document.getElementById("pauseButton");
    const circles = [];

    // Respect the user's OS-level reduced motion setting. If they've asked
    // for reduced motion, start paused rather than auto-playing and making
    // them find and hit the pause button themselves.
    const prefersReducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
    ).matches;
    let isPaused = prefersReducedMotion;

    function createCircle() {
        const radius = Math.random() * 40 + 10;
        return {
            // Keep each circle fully inside the canvas when it's created,
            // so it can't get stuck bouncing against an edge.
            x: radius + Math.random() * (canvas.width - radius * 2),
            y: radius + Math.random() * (canvas.height - radius * 2),
            radius: radius,
            color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            dx: (Math.random() - 0.5) * 4,
            dy: (Math.random() - 0.5) * 4,
        };
    }

    for (let i = 0; i < 10; i++) {
        circles.push(createCircle());
    }

    function drawCircles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        circles.forEach(circle => {
            ctx.beginPath();
            ctx.arc(circle.x, circle.y, circle.radius, 0, Math.PI * 2);
            ctx.fillStyle = circle.color;
            ctx.fill();
            ctx.closePath();
        });
    }

    function animate() {
        if (!isPaused) {
            circles.forEach(circle => {
                circle.x += circle.dx;
                circle.y += circle.dy;

                if (circle.x - circle.radius < 0 || circle.x + circle.radius > canvas.width) {
                    circle.dx *= -1;
                }
                if (circle.y - circle.radius < 0 || circle.y + circle.radius > canvas.height) {
                    circle.dy *= -1;
                }
            });
            drawCircles();
        }
        requestAnimationFrame(animate);
    }

    // Draw the initial frame even if starting paused, so reduced-motion
    // users still see the circles rather than a blank canvas.
    drawCircles();
    animate();

    // The button label changes to describe the action it will perform next.
    // aria-pressed is not used as well, because a changing label plus a
    // pressed state can produce confusing announcements such as
    // "Resume animation, toggle button, pressed".
    function updatePauseButton() {
        pauseButton.textContent = isPaused ? "Resume animation" : "Pause animation";
    }
    updatePauseButton();

    pauseButton.addEventListener("click", () => {
        isPaused = !isPaused;
        updatePauseButton();
    });
</script>


<p class="footer-link"><span aria-hidden="true" class="arrow">&laquo;</span> <a href="testing.html">Back to home</a></p>
</main>
</body>
</html>
