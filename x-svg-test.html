<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SVG accessible name tests</title>
  <style>
    svg {
      display: block;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <h1>SVG accessible name tests</h1>

  <h2>Example 1: No accessible name</h2>
  <svg width="100" height="100" viewBox="0 0 100 100">
    <rect width="100" height="100"></rect>
  </svg>

  <h2>Example 2: aria-label</h2>
  <svg
    width="100"
    height="100"
    viewBox="0 0 100 100"
    aria-label="Example 2"
  >
    <rect width="100" height="100"></rect>
  </svg>

  <h2>Example 3: aria-label and role="img"</h2>
  <svg
    width="100"
    height="100"
    viewBox="0 0 100 100"
    role="img"
    aria-label="Example 3"
  >
    <rect width="100" height="100"></rect>
  </svg>
</body>
</html>
